spring:
  application:
    name: akashi-cinema
  config:
    import: optional:file:./.env[.properties],optional:file:../.env[.properties]
  datasource:
    url: jdbc:mysql://localhost:${DB_PORT:3307}/${DB_NAME}?useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          starttls:
            enable: true
            required: true

server:
  port: 8080

akashi:
  jwt:
    secret: ${JWT_SECRET}
    expiry-minutes: 60
  otp:
    expiry-minutes: 5
    max-attempts: 5
    resend-seconds: 60
    max-per-hour: 5
